name: TMS Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-tms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Verify TMS and original gate behavior
        run: python -m pytest -q
      - name: Execute all four synthetic TMS journeys
        run: python -m tms demo --output-dir reports/tms-demo
      - name: Verify compatibility with the previous public export and CSV gate
        shell: python
        run: |
          import json
          from pathlib import Path
          import subprocess
          import sys
          result = subprocess.run([
              sys.executable, 'modules/release_gate/run_workflow_gate.py', '--strict',
              '--input', 'demo/release-gate/synthetic-evidence.json',
              '--policy', 'modules/release_gate/examples/workflow/policy.json',
              '--as-of', '2026-10-16T00:00:00Z',
              '--output-dir', 'reports/release-gate-demo',
          ])
          if result.returncode != 3:
              raise SystemExit(f'Expected manual hold (3), got {result.returncode}')
          report = json.loads(Path('reports/release-gate-demo/result.json').read_text())
          assert report['decision'] == 'CONDITIONAL_GO'
          assert report['evidence']['status'] == 'COMPLETE'
          assert report['risk']['score'] == 15
          legacy = subprocess.run([sys.executable, 'modules/release_gate/run_gate.py', '--strict'], capture_output=True, text=True)
          print(legacy.stdout)
          assert legacy.returncode == 1 and 'Release Gate: NO_GO' in legacy.stdout, 'Expected legacy NO_GO, not an execution error'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-tms-reports
          path: |
            reports/
            modules/release_gate/reports/
          if-no-files-found: error
